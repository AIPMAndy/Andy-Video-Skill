name: Video Director CI

on:
  pull_request:
    paths:
      - "00-orchestration/**"
      - "scripts/install-all.sh"
      - "scripts/verify.sh"
      - ".github/workflows/video-director-ci.yml"
  push:
    paths:
      - "00-orchestration/**"
      - "scripts/install-all.sh"
      - "scripts/verify.sh"
      - ".github/workflows/video-director-ci.yml"

jobs:
  standard-library-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python 3 runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python code
        run: python -m py_compile 00-orchestration/andy-video-director/director.py 00-orchestration/andy-video-director/promo_workflow.py
      - name: Run deterministic routing tests
        run: python -m unittest discover -s 00-orchestration/andy-video-director/tests -v
      - name: Check registry and planner
        run: |
          python 00-orchestration/andy-video-director/director.py plan --request "知识科普短视频" > /tmp/video-plan.json
          python -m json.tool /tmp/video-plan.json > /dev/null
          python 00-orchestration/andy-video-director/director.py bootstrap bb-video > /tmp/video-dry-run.json
          python -m json.tool /tmp/video-dry-run.json > /dev/null
          bash scripts/verify.sh
      - name: Promo planner smoke and expected blocked audit
        run: |
          python 00-orchestration/andy-video-director/director.py promo-init --brief 00-orchestration/andy-video-director/examples/product-launch-brief.json --out "$RUNNER_TEMP/promo"
          python -m json.tool "$RUNNER_TEMP/promo/product_promo_plan.json" > /dev/null
          set +e
          python 00-orchestration/andy-video-director/director.py promo-audit --plan "$RUNNER_TEMP/promo/product_promo_plan.json" --assets-root "$RUNNER_TEMP" > "$RUNNER_TEMP/audit.json"
          code=$?
          set -e
          test "$code" -eq 2
          grep -q '"status": "blocked"' "$RUNNER_TEMP/audit.json"

  bb-upstream-integration-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install exact pinned upstream complete skill source
        run: |
          python3 00-orchestration/andy-video-director/director.py bootstrap bb-video --dest "$RUNNER_TEMP/skills" --execute
          test -f "$RUNNER_TEMP/skills/bb-video/UPSTREAM_LICENSE"
          test -f "$RUNNER_TEMP/skills/bb-video/styles/whiteboard/STYLE.md"
          test -f "$RUNNER_TEMP/skills/bb-video/styles/launch/STYLE.md"
          test -f "$RUNNER_TEMP/skills/bb-video/promo/scripts/render.mjs"
          test -f "$RUNNER_TEMP/skills/bb-video/explainer/scripts/new.mjs"
      - name: Actually run BB project generators in two modes
        run: |
          node "$RUNNER_TEMP/skills/bb-video/explainer/scripts/new.mjs" "$RUNNER_TEMP/whiteboard-demo" --style whiteboard
          test -f "$RUNNER_TEMP/whiteboard-demo/index.html"
          test -f "$RUNNER_TEMP/whiteboard-demo/storyboard.md"
          node "$RUNNER_TEMP/skills/bb-video/promo/scripts/new.mjs" "$RUNNER_TEMP/promo-demo" --style launch
          test -f "$RUNNER_TEMP/promo-demo/index.html"
          test -f "$RUNNER_TEMP/promo-demo/shots.json"
